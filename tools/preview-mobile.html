<!doctype html><meta charset="utf-8"><title>NEM mobile check</title>
<style>body{margin:0;background:#eee;font:12px monospace}pre{white-space:pre-wrap;width:390px}iframe{border:0;display:block;background:white}</style>
<pre id="result">Loading…</pre><iframe width="390" height="844" src="../"></iframe>
<script>document.querySelector('iframe').onload=function(){const w=this.contentWindow,d=w.document,out=[];const check=(ok,name)=>out.push((ok?'PASS ':'FAIL ')+name);check(d.documentElement.scrollWidth<=390,'no horizontal overflow');const m=d.querySelector('.menu-toggle');m.click();check(m.getAttribute('aria-expanded')==='true'&&d.querySelector('#nem-nav').classList.contains('open'),'mobile menu');m.click();const s=d.querySelector('.search-toggle');s.click();check(!d.querySelector('.nem-search').hidden,'search panel');s.click();d.querySelector('.hero-next').click();check(d.querySelectorAll('.hero-slide')[0].hidden&&!d.querySelectorAll('.hero-slide')[1].hidden,'banner next');d.querySelector('.hero-prev').click();check(!d.querySelectorAll('.hero-slide')[0].hidden,'banner previous');check(d.querySelectorAll('.nem-product').length===8,'8 product cards');document.querySelector('#result').textContent=out.join('\n');};</script>
